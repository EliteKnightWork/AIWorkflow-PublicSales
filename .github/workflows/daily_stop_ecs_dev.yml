name: Dev環境のECSサーバー夜間停止ジョブ

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      target_service:
        description: '停止対象サービス'
        required: false
        default: all
        type: choice
        options:
          - all
          - labid-admin-server-service-dev
          - labid-agent-service-dev
          - labid-client-service-dev
          - labid-server-service-dev
          - labid-solid-queue-service-dev

env:
  AWS_REGION: ap-northeast-1
  ECS_CLUSTER: labid-app-cluster-dev
  DEFAULT_TARGET_SERVICES: |
    labid-admin-server-service-dev
    labid-agent-service-dev
    labid-client-service-dev
    labid-server-service-dev
    labid-solid-queue-service-dev

jobs:
  stop-ecs-services:
    name: Stop ECS Services
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine target services
        id: target-services
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ github.event.inputs.target_service }}"
            if [ -n "$target" ] && [ "$target" != "all" ]; then
              {
                echo "services<<EOF"
                printf '%s\n' "$target"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          {
            echo "services<<EOF"
            printf '%s\n' "${{ env.DEFAULT_TARGET_SERVICES }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stop ECS services
        run: |
          while IFS= read -r service; do
            [ -z "$service" ] && continue
            echo "Stopping $service"
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$service" \
              --desired-count 0
          done <<< "${{ steps.target-services.outputs.services }}"
