        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties: {}
      description: お気に入り登録
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                uuid:
                  type: string
                  description: 入札案件UUID
                  x-stoplight:
                    id: d0icsn7ynro9p
        description: ''
      tags:
        - favorites
      parameters: []
      security:
        - Bearer token: []
    parameters: []
  '/v1/favorites/{uuid}':
