openapi: 3.0.0
x-stoplight:
  id: metnrdvzq0rn6
info:
  title: Labid API
  version: '1.0'
servers:
  - url: 'http://localhost:3000'
x-json-schema-faker:
  locale: ja
  min-items: 2
  max-items: 10
  optionalsProbability: 0.5
  resolve-json-path: true
tags:
  - name: awarded_projects
  - name: favorites
  - name: health
  - name: notification_methods
  - name: participate_qualifications
  - name: project_summary_usages
  - name: projects
  - name: search_filter_presets
  - name: business_description_formats
  - name: company_projects
  - name: company_information
  - name: security_qualifications
paths:
  /v1/projects/search:
    get:
      summary: 入札案件検索API
      tags:
        - projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    type: object
                    additionalProperties: false
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
                      aggregation:
                        $ref: '#/components/schemas/Aggregation'
        '303':
          description: See Other
          headers:
            Location:
              schema:
                type: string
              description: リダイレクト先
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties: {}
      operationId: searchProjects
      description: 入札案件の検索結果を取得する
      parameters:
        - schema:
            type: array
            items:
              type: string
          in: query
          name: keywords
          description: 必須キーワード
        - schema:
            type: array
            items:
              type: string
          in: query
          name: orKeywords
          description: 任意キーワード
        - schema:
            type: array
            items:
              type: string
          in: query
          name: notKeywords
          description: 除外キーワード
        - schema:
            type: array
            items:
              $ref: '#/components/schemas/ProcedureType'
          in: query
          name: procedureTypes
          description: 入札方式
        - schema:
            type: array
            items:
              type: string
          in: query
          name: prefectures
          description: 都道府県
        - schema:
            type: string
            enum:
              - 1week
              - 1month
              - 3months
          in: query
          name: period
          description: 検索日付範囲
        - schema:
            type: integer
            example: 1
          in: query
          name: page
          description: ページ
        - schema:
            type: string
            example: o_kkj-api
          in: query
          name: source
          description: 取得元サイトの識別子
        - schema:
            type: string
          in: query
          name: publicationDateFrom
          description: 検索範囲開始日
        - schema:
            type: string
          in: query
          name: publicationDateTo
          description: 検索範囲終了日
        - schema:
            $ref: '#/components/schemas/SortBy'
          in: query
          name: sortBy
          description: 並び順
        - schema:
            type: string
            enum:
              - match
              - query_string
          in: query
          name: method
          description: match or query_string
        - schema:
            $ref: '#/components/schemas/ProjectStatusTab'
          in: query
          name: tab
          description: タブ
        - schema:
            type: array
            items:
              type: string
          in: query
          name: procedureTypeGroups
          description: 入札方式グループ
        - schema:
            type: string
          in: query
          name: organizationName
          description: 発注機関名
        - schema:
            type: array
            items:
              type: string
          in: query
          name: organizationNameArray
          description: 発注機関名の配列
        - schema:
            type: integer
          in: query
          name: plannedPriceFrom
          description: 予定価格範囲開始
        - schema:
            type: integer
          in: query
          name: plannedPriceTo
          description: 予定価格範囲終了
        - schema:
            type: boolean
          in: query
          name: isExperienceRequired
          description: 実績有無要否
        - schema:
            type: boolean
          in: query
          name: withoutAggregations
          description: 集計情報が必要か
        - schema:
            type: string
          in: query
          name: registrationDateFrom
          description: 登録日検索範囲開始日
        - schema:
            type: string
          in: query
          name: registrationDateTo
          description: 登録日検索範囲終了日
        - schema:
            type: array
            items:
              type: string
          in: query
          name: organization_name_array
          description: 発注機関名の配列
        - schema:
            type: boolean
          in: query
          name: isOfficeRequired
          description: 事業所要件の有無
        - schema:
            type: array
            items:
              type: string
              enum:
                - ISMS
                - Pマーク
                - ISO
                - 不要
          in: query
          name: projectSecurityQualifications
          description: セキュリティ要件
        - schema:
            type: array
            items:
              type: integer
          in: query
          name: participateQualificationIds
          description: 入札参加資格ID
        - schema:
            type: array
            items:
              type: integer
          in: query
          name: participateQualificationGradeIds
          description: 入札参加資格等級ID
        - schema:
            type: array
            items:
              type: string
          in: query
          name: participateQualificationTypes
          description: 入札参加資格種別
        - schema:
            type: array
            items:
              type: string
          in: query
          name: participateQualificationPrefectures
          description: 入札参加資格都道府県
        - schema:
            type: boolean
          in: query
          name: noQualification
          description: 参加資格なしフラグ
        - schema:
            type: string
          in: query
          name: bidCompanyName
          description: 参加企業名
        - schema:
            type: integer
          in: query
          name: deadlineDaysRemaining
          description: 締切日までの残り日数
        - schema:
            type: boolean
          in: query
          name: onlySuccessfulBidders
          description: 落札者フラグ
        - schema:
            type: string
          in: query
          name: tenderOpeningDateFrom
          description: 落札日検索範囲開始日
        - schema:
            type: string
          in: query
          name: tenderOpeningDateTo
          description: 落札日検索範囲終了日
        - schema:
            type: integer
          in: query
          name: perPage
          description: 1ページあたりの件数
        - schema:
            type: boolean
          in: query
          name: useSynonymSearch
          description: シノニム検索を使用するか
      requestBody:
        content: {}
    parameters: []
  '/v1/projects/{uuid}':
    parameters:
      - schema:
          type: string
        name: uuid
        in: path
        required: true
    get:
      summary: 入札案件詳細API
      tags:
        - projects
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '303':
          description: See Other
          headers:
            Location:
              schema:
                type: string
              description: リダイレクト先URL
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties: {}
      operationId: getProject
      description: 入札案件詳細を取得する
      parameters: []
  '/v1/awarded_projects/{uuid}':
    parameters:
      - schema:
          type: string
        name: uuid
