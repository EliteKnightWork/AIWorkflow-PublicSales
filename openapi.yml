          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties: {}
      operationId: getAwardedProject
      description: 落札案件詳細を取得する
      parameters: []
      tags:
        - awarded_projects
  /v1/favorites:
    get:
      summary: お気に入り取得API
