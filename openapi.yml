          name: user_ids
          description: ユーザーID
          style: form
          explode: true
        - schema:
            type: string
          in: query
          name: sortBy
          description: 並び順
      security:
        - Bearer token: []
    post:
      summary: お気に入り登録API
      operationId: addFavorite
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
