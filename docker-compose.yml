  #     - my_network
  #   depends_on:
  #     - app
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   ports:
  #     - "4566:4566"
  #   environment:
  #     - SERVICES=sqs,lambda,cloudformation,ssm,logs,iam
  #     - DEBUG=1
  #     - LAMBDA_EXECUTOR=docker
  #     - HOSTNAME_EXTERNAL=localstack
  #   volumes:
  #     - "./.localstack:/var/lib/localstack"
  #     - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  es_data:
    driver: local
  bundle:
    driver: local

networks:
  my_network:
